name = "agent-07-workflow"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[ai]
binding = "AI"   # Workers AI free tier (10k neurons/day), no API keys

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_ID"   # wrangler kv namespace create KV

